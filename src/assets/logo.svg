<svg width="240" height="64" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: stacked checkmark/task layers forming a "d" abstraction -->
  <g transform="translate(0, 8)">
    <rect x="0" y="20" width="10" height="10" rx="3" fill="#16A34A"/>
    <rect x="14" y="20" width="10" height="10" rx="3" fill="#22C55E" opacity="0.85"/>
    <rect x="0" y="6" width="10" height="10" rx="3" fill="#16A34A" opacity="0.6"/>
    <path d="M2 38 L9 45 L24 28" stroke="#15803D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="38" y="34" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="currentColor">
    dNextask
  </text>

  <!-- Tagline -->
  <text x="38" y="50" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="1.5" fill="#16A34A">
    ORGANIZE. MANAGE. DELIVER.
  </text>
</svg>
